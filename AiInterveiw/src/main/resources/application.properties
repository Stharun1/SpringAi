# ===============================
# Application
# ===============================
spring.application.name=ai-interview

# ===============================
# OpenAI - Chat & Embeddings
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=1024

# ===============================
# Pinecone - Vector Store
# ===============================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:sde-rag-index}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:sde}